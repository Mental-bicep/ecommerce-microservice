spring.application.name=payment-service
server.port=8085


# -------------------------------------------------------------
# SPRING CLOUD CONFIG CLIENT
# -------------------------------------------------------------
# Pull configurations from Config Server on startup
spring.config.import=optional:configserver:http://localhost:8888

# -------------------------------------------------------------
# EUREKA CLIENT CONFIGURATION
# -------------------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# -------------------------------------------------------------
# KAFKA CONSUMER CONFIGURATION
# -------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=delivery-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Allow Jackson to deserialize any trusted package payload into DTOs
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# -------------------------------------------------------------
# MYSQL & JPA CONFIGURATION 
# -------------------------------------------------------------
# Docker MySQL URL
spring.datasource.url=jdbc:mysql://localhost:3307/ecommerce_microservice_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#Local MySQL URL
#spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_microservice_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect